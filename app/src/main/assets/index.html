<style>
/* Layout: one full-bleed canvas world with the HUD painted on top; thumbs own the lower corners. */
:root {
  --ground: #223319;
  --ink: #fff8e7;
  --corn: #ffc83d;
  --comb: #e4413a;
  --grass: #4f9a35;
  --font-display: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme: dark;
}
html, body {
  height: 100%;
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  outline: none;
}
#insets {
  position: fixed;
  left: 0;
  top: 0;
  visibility: hidden;
  pointer-events: none;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}

IÓN PERDIDA"],["WRONG PIN", "НЕВІРНИЙ ПІН-КОД", "PIN INCORRECTO"],["DIFFERENT GAME VERSION", "РІЗНІ ВЕРСІЇ ГРИ", "VERSIONES DISTINTAS"],["COULD NOT CONNECT", "НЕ ВДАЛОСЯ ПІДКЛЮЧИТИСЯ", "NO SE PUDO CONECTAR"],["COULD NOT START", "НЕ ВДАЛОСЯ ЗАПУСТИТИ", "NO SE PUDO INICIAR"],["FRAME RATE","ЧАСТОТА КАДРІВ","FOTOGRAMAS POR SEG."],["Higher is smoother, lower saves battery. 120 needs a 120 Hz screen.","Чим вище, тим плавніше; нижче — економить батарею. Для 120 потрібен екран 120 Гц.","Más alto es más fluido; más bajo ahorra batería. 120 requiere una pantalla de 120 Hz."],["PEASHOOTER","ГОРОХОСТРІЛ","LANZAGUISANTES"],["SCATTER","ДРОБОВИК","ESCOPETA"],["RAPID PECK","СКОРОКЛЮВ","PICOTAZO RÁPIDO"],["EGG-ZOOKA","ЯЄЦЕЗУКА","HUEVOZUCA"],["LASER BEAK","ЛАЗЕРНИЙ ДЗЬОБ","PICO LÁSER"],["FLAMER","ВОГНЕМЕТ","LANZALLAMAS"],["CROSSBOW","АРБАЛЕТ","BALLESTA"],["GRENADES","ГРАНАТИ","GRANADAS"],["RUNNER - fast, zig-zags","БІГУН - швидкий, петляє","CORREDOR - rápido, hace zigzag"],["MEDIC - heals the flock, kill it first!","ЛІКАР - лікує зграю, бий першим!","MÉDICO - cura a la bandada, ¡acaba con él primero!"],["KAMIKAZE - shoot it before it blows!","КАМІКАДЗЕ - убий до вибуху!","KAMIKAZE - ¡dispárale antes de que explote!"],["COMMON","ЗВИЧАЙНЕ","COMÚN"],["RARE","РІДКІСНЕ","RARO"],["EPIC","ЕПІЧНЕ","ÉPICO"],["Double Damage","Подвійна шкода","Daño doble"],["Every bullet hits twice as hard.","Кожна куля б'є вдвічі сильніше.","Cada bala golpea el doble de fuerte."],["Sharp Beak","Гострий дзьоб","Pico afilado"],["+25% damage.","+25% шкоди.","+25% de daño."],["Quick Trigger","Швидкий спуск","Gatillo rápido"],["+20% fire rate.","+20% скорострільності.","+20% de cadencia de fuego."],["Piercing Rounds","Бронебійні","Balas perforantes"],["Bullets pass through 1 more enemy.","Кулі пробивають ще 1 ворога.","Las balas atraviesan 1 enemigo más."],["Ricochet","Рикошет","Rebote"],["Bullets bounce off crates and the fence 1 more time.","Кулі відскакують від ящиків і паркану ще 1 раз.","Las balas rebotan 1 vez más en cajas y en la valla."],["Extra Pellet","Зайва дробина","Perdigón extra"],["Every shot fires 1 extra bullet.","Кожен постріл дає 1 додаткову кулю.","Cada disparo lanza 1 bala extra."],["Explosive Eggs","Вибухові яйця","Huevos explosivos"],["Bullets explode on impact. Bigger blast each level.","Кулі вибухають при влученні. З кожним рівнем вибух більший.","Las balas explotan al impactar. Mayor explosión en cada nivel."],["Critical Peck","Критичний дзьоб","Picotazo crítico"],["+12% crit chance. Crits hit 2x.","+12% шансу криту. Криті удари завдають ×2.","+12% de probabilidad crítica. Los críticos golpean x2."],["Deadly Crits","Смертельні криті","Críticos letales"],["+75% crit damage.","+75% шкоди від критів.","+75% de daño crítico."],["Long Range","Далекобійність","Largo alcance"],["+30% bullet range.","+30% дальності куль.","+30% de alcance de bala."],["Steady Aim","Твердий приціл","Puntería firme"],["30% less bullet spread.","На 30% менший розкид куль.","30% menos de dispersión."],["Flaming Feathers","Палаюче пір'я","Plumas en llamas"],["Hits set enemies on fire.","Влучання підпалюють ворогів.","Los impactos prenden fuego a los enemigos."],["Frost Feathers","Морозне пір'я","Plumas de escarcha"],["Hits slow enemies down.","Влучання сповільнюють ворогів.","Los impactos ralentizan a los enemigos."],["Finisher","Добивання","Remate"],["Enemies under 15% health die instantly.","Вороги з менш ніж 15% здоров'я гинуть миттєво.","Los enemigos con menos del 15% de salud mueren al instante."],["Chain Lightning","Ланцюгова блискавка","Rayo en cadena"],["Kills zap the nearest enemy.","Вбивства б'ють блискавкою найближчого ворога.","Las bajas lanzan un rayo al enemigo más cercano."],["Peashooter Mk II","Горохостріл Mk II","Lanzaguisantes Mk II"],["Peashooter: +40% damage and +25% fire rate.","Горохостріл: +40% шкоди та +25% скорострільності.","Lanzaguisantes: +40% de daño y +25% de cadencia."],["Scatter Gun Mk II","Дробовик Mk II","Escopeta Mk II"],["Scatter: +2 pellets, +25% damage, +15 shells.","Дробовик: +2 дробини, +25% шкоди, +15 патронів.","Escopeta: +2 perdigones, +25% de daño, +15 cartuchos."],["Rapid Peck Mk II","Скороклюв Mk II","Picotazo rápido Mk II"],["Rapid Peck: +35% fire rate, +20% damage, +60 rounds.","Скороклюв: +35% скорострільності, +20% шкоди, +60 патронів.","Picotazo rápido: +35% de cadencia, +20% de daño, +60 balas."],["Egg-zooka","Яйцезука","Huevozuca"],["Unlock explosive rockets. Comes with 10.","Відкриває вибухові ракети. У комплекті 10.","Desbloquea cohetes explosivos. Incluye 10."],["Laser Beak","Лазерний дзьоб","Pico láser"],["Unlock a rapid piercing beam gun. Comes with 120.","Відкриває швидкий пробивний промінь. У комплекті 120.","Desbloquea un rayo rápido que perfora. Incluye 120."],["Flamethrower","Вогнемет","Lanzallamas"],["Unlock a short-range fire hose that burns everything it touches. Comes with 150 fuel.","Відкриває вогняний шланг малого радіуса, що спалює все на шляху. У комплекті 150 пального.","Desbloquea una manguera de fuego de corto alcance que quema todo lo que toca. Incluye 150 de combustible."],["Crossbow","Арбалет","Ballesta"],["Unlock a heavy bolt that pierces 4 enemies. Comes with 14 bolts.","Відкриває важкий болт, що пробиває 4 ворогів. У комплекті 14 болтів.","Desbloquea un virote pesado que atraviesa a 4 enemigos. Incluye 14 virotes."],["Grenade Launcher","Гранатомет","Lanzagranadas"],["Unlock bouncing grenades with a huge blast. Comes with 10.","Відкриває гранати, що відскакують, з величезним вибухом. У комплекті 10.","Desbloquea granadas que rebotan con una explosión enorme. Incluye 10."],["Egg-zooka Mk II","Яйцезука Mk II","Huevozuca Mk II"],["Egg-zooka: +30% damage, +20% blast radius, +4 rockets.","Яйцезука: +30% шкоди, +20% радіусу вибуху, +4 ракети.","Huevozuca: +30% de daño, +20% de radio de explosión, +4 cohetes."],["Laser Beak Mk II","Лазерний дзьоб Mk II","Pico láser Mk II"],["Laser Beak: +30% fire rate, pierces 1 more enemy, +60 charge.","Лазерний дзьоб: +30% скорострільності, пробиває ще 1 ворога, +60 заряду.","Pico láser: +30% de cadencia, perfora 1 enemigo más, +60 de carga."],["Napalm Tank","Напалмовий бак","Tanque de napalm"],["Flamethrower: +35% damage, +25% fire rate, +80 fuel.","Вогнемет: +35% шкоди, +25% скорострільності, +80 пального.","Lanzallamas: +35% de daño, +25% de cadencia, +80 de combustible."],["Barbed Bolts","Колючі болти","Virotes con púas"],["Crossbow: +45% damage, +25% fire rate, +6 bolts.","Арбалет: +45% шкоди, +25% скорострільності, +6 болтів.","Ballesta: +45% de daño, +25% de cadencia, +6 virotes."],["Heavy Grenades","Важкі гранати","Granadas pesadas"],["Grenades: +30% damage, +25% blast radius, +4 grenades.","Гранати: +30% шкоди, +25% радіусу вибуху, +4 гранати.","Granadas: +30% de daño, +25% de radio de explosión, +4 granadas."],["Ammo Cache","Склад патронів","Alijo de munición"],["Refill special guns. Unlocks shotgun and Rapid Peck.","Поповнює спецзброю. Відкриває дробовик і Скороклюв.","Recarga las armas especiales. Desbloquea la escopeta y el picotazo rápido."],["Bigger Mags","Більші магазини","Cargadores grandes"],["Ammo crates give 50% more.","Ящики з патронами дають на 50% більше.","Las cajas de munición dan 50% más."],["Tough Hen","Міцна курка","Gallina dura"],["+25 max health and heal 25.","+25 макс. здоров'я та лікування на 25.","+25 de salud máxima y cura 25."],["Free Range Healing","Лікування на волі","Curación en libertad"],["Regenerate 1.5 health every second.","Відновлює 1,5 здоров'я щосекунди.","Regenera 1,5 de salud por segundo."],["Vampire Beak","Дзьоб-вампір","Pico vampiro"],["Heal 6% of the damage you deal.","Лікує 6% завданої шкоди.","Curas el 6% del daño que haces."],["Eggshell Armor","Броня зі шкаралупи","Armadura de cascarón"],["Blocks the next hit. Recharges every wave.","Блокує наступний удар. Відновлюється щохвилі.","Bloquea el siguiente golpe. Se recarga cada oleada."],["Mirror Feathers","Дзеркальне пір'я","Plumas espejo"],["Reflect enemy bullets at 2.5x damage (40%, 70%, 100%).","Відбиває ворожі кулі з шкодою ×2,5 (40%, 70%, 100%).","Refleja las balas enemigas con 2,5x de daño (40%, 70%, 100%)."],["Thorny Plumage","Колюче оперення","Plumaje espinoso"],["Melee attackers take 25 damage per hit.","Ті, хто б'ється впритул, отримують 25 шкоди за удар.","Los atacantes cuerpo a cuerpo reciben 25 de daño por golpe."],["Second Wind","Друге дихання","Segundo aliento"],["Revive once at half health when you would die.","Один раз воскресаєш із половиною здоров'я, коли мав би загинути.","Revives una vez con la mitad de salud cuando ibas a morir."],["Lucky Dodge","Щасливе ухилення","Esquiva afortunada"],["10% chance to ignore any hit.","10% шансу ігнорувати будь-яке влучання.","10% de probabilidad de ignorar cualquier golpe."],["Padded Down","М'який пух","Plumón acolchado"],["Take 10% less damage.","Отримуєш на 10% менше шкоди.","Recibes 10% menos de daño."],["Adrenaline","Адреналін","Adrenalina"],["Under 35% health: +40% fire rate and +20% speed.","Коли здоров'я нижче 35%: +40% скорострільності та +20% швидкості.","Con menos del 35% de salud: +40% de cadencia y +20% de velocidad."],["Berserker","Берсерк","Berserker"],["After you take a hit, deal +60% damage for 3 seconds.","Після влучання по тобі завдаєш +60% шкоди протягом 3 секунд.","Tras recibir un golpe, haces +60% de daño durante 3 segundos."],["Nest Rest","Відпочинок у гнізді","Descanso en el nido"],["Heal 15 extra after every wave.","Лікує ще 15 після кожної хвилі.","Cura 15 extra después de cada oleada."],["Swift Talons","Прудкі кігті","Garras veloces"],["+15% movement speed.","+15% швидкості пересування.","+15% de velocidad de movimiento."],["Kill Sprint","Ривок після вбивства","Carrera tras la baja"],["Kills give +30% speed for 2 seconds.","Вбивства дають +30% швидкості на 2 секунди.","Cada baja da +30% de velocidad durante 2 segundos."],["Magnet Beak","Магнітний дзьоб","Pico imán"],["Pickups fly to you from farther away.","Предмети летять до тебе з більшої відстані.","Los objetos vuelan hacia ti desde más lejos."],["Orbiting Eggs","Яйця на орбіті","Huevos en órbita"],["An egg circles you and cracks enemies. +1 egg per level.","Яйце кружляє навколо тебе й б'є ворогів. +1 яйце за рівень.","Un huevo gira a tu alrededor y golpea a los enemigos. +1 huevo por nivel."],["Time Warp","Викривлення часу","Distorsión temporal"],["Enemies move 12% slower.","Вороги рухаються на 12% повільніше.","Los enemigos se mueven 12% más lento."],["Double XP","Подвійний досвід","Experiencia doble"],["Earn twice the XP from every kill.","Отримуй удвічі більше досвіду за кожне вбивство.","Ganas el doble de experiencia por cada baja."],["Golden Yolk","Золотий жовток","Yema dorada"],["+30% score from kills.","+30% очок за вбивства.","+30% de puntos por bajas."],["Lucky Drops","Щасливі дропи","Botín afortunado"],["+50% pickup drop chance.","+50% шансу випадіння предметів.","+50% de probabilidad de botín."],["Corn Fed","Відгодована кукурудзою","Bien alimentada"],["Corn heals 50% more.","Кукурудза лікує на 50% більше.","El maíz cura 50% más."],["HARDY HEN","ВИТРИВАЛА КУРКА","GALLINA RESISTENTE"],["HEAVY BEAK","ВАЖКИЙ ДЗЬОБ","PICO PESADO"],["QUICK LEGS","ШВИДКІ ЛАПКИ","PATAS RÁPIDAS"],["SPARE WEAPON","ЗАПАСНА ЗБРОЯ","ARMA DE RESERVA"],["HEAD START","ШВИДКИЙ СТАРТ","VENTAJA INICIAL"],["QUICK LEARNER","ШВИДКИЙ УЧЕНЬ","APRENDIZ RÁPIDO"],["LUCKY BEAK","ЩАСЛИВИЙ ДЗЬОБ","PICO DE LA SUERTE"],["DRONE CHICK","КУРЧА-ДРОН","POLLITO DRON"],["Maxed out.","Максимум.","Al máximo."],["Start every run with a Scatter gun (24 shells).","Починай кожен забіг із дробовиком (24 патрони).","Empieza cada partida con una escopeta (24 cartuchos)."],["Also start with Rapid Peck (90 rounds).","Також починаєш зі Скороклювом (90 патронів).","También empiezas con el picotazo rápido (90 balas)."],["Also start with an Egg-zooka (6 rockets).","Також починаєш із Яйцезукою (6 ракет).","También empiezas con la huevozuca (6 cohetes)."],["Start every run with a power-up of your choice.","Починай кожен забіг із бонусом на твій вибір.","Empieza cada partida con una mejora a tu elección."],["Add a second starting power-up.","Додає другий стартовий бонус.","Añade una segunda mejora inicial."],["Maxed out. Pick your power-ups below.","Максимум. Обери бонуси нижче.","Al máximo. Elige tus mejoras abajo."],["A little helper chick circles you and shoots nearby enemies.","Маленьке курча-помічник кружляє навколо тебе й стріляє по ворогах поблизу.","Un pollito ayudante gira a tu alrededor y dispara a los enemigos cercanos."],["Add a second drone chick.","Додає друге курча-дрон.","Añade un segundo pollito dron."],["Add a third drone chick.","Додає третє курча-дрон.","Añade un tercer pollito dron."],["CLUCK","КВОК","CLUC"],["The classic. Balanced.","Класика. Збалансована.","La clásica. Equilibrada."],["100 health, normal speed","100 здоров'я, звичайна швидкість","100 de salud, velocidad normal"],["Good at everything","Добра в усьому","Buena en todo"],["BRICKHOUSE","ГЛИБА","MURALLA"],["Slow, tough and thorny.","Повільна, міцна й колюча.","Lenta, dura y espinosa."],["150 health, 10% less damage taken","150 здоров'я, на 10% менше отриманої шкоди","150 de salud, 10% menos de daño recibido"],["16% slower, bigger body","На 16% повільніша, більше тіло","16% más lenta, cuerpo más grande"],["Thorny plumage, starts with 30 shells","Колюче оперення, стартує з 30 патронами","Plumaje espinoso, empieza con 30 cartuchos"],["HAWKEYE","СОКОЛИНЕ ОКО","OJO DE HALCÓN"],["Fragile, but every shot counts.","Тендітна, але кожен постріл на вагу золота.","Frágil, pero cada disparo cuenta."],["80 health","80 здоров'я","80 de salud"],["Peashooter: 2.4x damage, slower, pierces","Горохостріл: ×2,4 шкоди, повільніший, пробиває","Lanzaguisantes: 2,4x de daño, más lento, perfora"],["+15% crit chance, +40% range","+15% шансу криту, +40% дальності","+15% de prob. crítica, +40% de alcance"],["BOOMER","БУМЕР","BOOMER"],["Everything explodes.","Усе вибухає.","Todo explota."],["90 health, 5% slower","90 здоров'я, на 5% повільніша","90 de salud, un 5% más lenta"],["Bullets explode, 10% less direct damage","Кулі вибухають, на 10% менше прямої шкоди","Las balas explotan, un 10% menos de daño directo"],["Starts with an Egg-zooka (8 rockets)","Починає з Яєцезукою (8 ракет)","Empieza con una Huevozuca (8 cohetes)"],["NEW HEN UNLOCKED","НОВУ КУРКУ ВІДКРИТО","¡NUEVA GALLINA DESBLOQUEADA!"],["FIRST BLOOD","ПЕРША КРОВ","PRIMERA SANGRE"],["Defeat your first enemy.","Переможи свого першого ворога.","Derrota a tu primer enemigo."],["GETTING WARM","РОЗІГРІВ","CALENTANDO"],["Reach wave 5.","Дійди до хвилі 5.","Llega a la oleada 5."],["DOUBLE DIGITS","ДВОЗНАЧНЕ ЧИСЛО","DOS CIFRAS"],["Reach wave 10.","Дійди до хвилі 10.","Llega a la oleada 10."],["VETERAN","ВЕТЕРАН","VETERANA"],["Reach wave 20.","Дійди до хвилі 20.","Llega a la oleada 20."],["LEGEND OF THE COOP","ЛЕГЕНДА КУРНИКА","LEYENDA DEL GALLINERO"],["Reach wave 30.","Дійди до хвилі 30.","Llega a la oleada 30."],["BIG GAME HUNTER","МИСЛИВЕЦЬ НА БОСІВ","CAZADORA DE JEFES"],["Defeat a boss.","Переможи боса.","Derrota a un jefe."],["BOSS COLLECTOR","КОЛЕКЦІОНЕР БОСІВ","COLECCIONISTA DE JEFES"],["Defeat 3 different bosses.","Переможи 3 різних босів.","Derrota a 3 jefes distintos."],["SPEED DEMON","ДЕМОН ШВИДКОСТІ","DEMONIO DE LA VELOCIDAD"],["Defeat a boss in under 60 seconds.","Переможи боса менш ніж за 60 секунд.","Derrota a un jefe en menos de 60 segundos."],["UNTOUCHABLE","НЕДОТОРКАННА","INTOCABLE"],["Clear a wave (3 or later) without taking damage.","Пройди хвилю (3-тю або пізнішу), не отримавши шкоди.","Supera una oleada (a partir de la 3) sin recibir daño."],["COMBO KING","КОРОЛЬ КОМБО","REY DEL COMBO"],["Reach a x5 combo.","Набери комбо ×5.","Consigue un combo ×5."],["POULTRY REAPER","ЖНЕЦЬ ПТАХІВ","SEGADORA DE AVES"],["Defeat 100 enemies in total.","Переможи 100 ворогів загалом.","Derrota a 100 enemigos en total."],["FEATHER STORM","ПІРНАТА БУРЯ","TORMENTA DE PLUMAS"],["Defeat 1000 enemies in total.","Переможи 1000 ворогів загалом.","Derrota a 1000 enemigos en total."],["POWER HEN","КУРКА-СИЛАЧКА","GALLINA PODEROSA"],["Reach level 10 in one run.","Досягни 10 рівня за один забіг.","Alcanza el nivel 10 en una partida."],["NEST EGG","ЗАОЩАДЖЕННЯ","HUEVO DE ORO"],["Own 500 coins at once.","Май 500 монет одночасно.","Ten 500 monedas a la vez."],["FULL COOP","ПОВНИЙ КУРНИК","GALLINERO LLENO"],["Unlock every hen.","Відкрий усіх курок.","Desbloquea todas las gallinas."],["DAILY GRIND","ЩОДЕННА РУТИНА","RUTINA DIARIA"],["Complete a daily challenge.","Виконай щоденне випробування.","Completa un desafío diario."],["KING OF THE COOP","КОРОЛЬ КУРНИКА","REY DEL GALLINERO"],["Defeat King Cluck the Last at wave 50.","Переможи Короля Клюка Останнього на хвилі 50.","Derrota al Rey Cluc el Último en la oleada 50."],["NO END IN SIGHT","КІНЦЯ НЕ ВИДНО","SIN FINAL A LA VISTA"],["Reach wave 60 in endless mode.","Дійди до хвилі 60 у нескінченному режимі.","Llega a la oleada 60 en el modo infinito."],["DAILY CHALLENGE COMPLETE","ЩОДЕННЕ ВИПРОБУВАННЯ ПРОЙДЕНО","DESAFÍO DIARIO COMPLETADO"],["GLASS CANNON","СКЛЯНА ГАРМАТА","CAÑÓN DE CRISTAL"],["Half health, double damage.","Половина здоров'я, подвійна шкода.","Mitad de salud, doble de daño."],["SWARM","РІЙ","ENJAMBRE"],["HORDE","ОРДА","HORDA"],["50% more enemies, but they are weaker.","На 50% більше ворогів, але вони слабші.","Un 50% más de enemigos, pero más débiles."],["TURBO","ТУРБО","TURBO"],["Everyone moves faster.","Усі рухаються швидше.","Todos se mueven más rápido."],["AMMO DROUGHT","ПОСУХА БОЄПРИПАСІВ","SEQUÍA DE MUNICIÓN"],["Few drops, but a stronger Peashooter.","Мало здобичі, зате сильніший Горохостріл.","Pocos botines, pero un Lanzaguisantes más fuerte."],["HEAVY HITTERS","ВАЖКОВИКИ","PESOS PESADOS"],["Enemies have 40% more health. Corn heals more.","У ворогів на 40% більше здоров'я. Кукурудза лікує більше.","Los enemigos tienen un 40% más de salud. El maíz cura más."],["IRON CHICKEN","ЗАЛІЗНА КУРКА","GALLINA DE HIERRO"],["No healing at all. Corn, regeneration and lifesteal do nothing.","Жодного лікування. Кукурудза, регенерація та вампіризм не працюють.","Nada de curación. El maíz, la regeneración y el robo de vida no hacen nada."],["PEASHOOTER ONLY","ЛИШЕ ГОРОХОСТРІЛ","SOLO LANZAGUISANTES"],["No weapon crates and no spare guns. Just the Peashooter.","Жодних ящиків зі зброєю і запасних гармат. Лише Горохостріл.","Sin cajas de armas ni armas de repuesto. Solo el Lanzaguisantes."],["SUNNY MEADOW","СОНЯЧНИЙ ЛУГ","PRADO SOLEADO"],["AUTUMN FARM","ОСІННЯ ФЕРМА","GRANJA OTOÑAL"],["MURKY SWAMP","МУТНЕ БОЛОТО","PANTANO TURBIO"],["FROZEN FIELD","ЗАМЕРЗЛЕ ПОЛЕ","CAMPO HELADO"],["WIND GUSTS PUSH YOU AND THE BULLETS","ПОРИВИ ВІТРУ ШТОВХАЮТЬ ТЕБЕ ТА КУЛІ","LAS RÁFAGAS DE VIENTO TE EMPUJAN A TI Y A LAS BALAS"],["PUDDLES SLOW YOU DOWN. FOG ROLLS IN.","КАЛЮЖІ УПОВІЛЬНЮЮТЬ ТЕБЕ. НАСУВАЄТЬСЯ ТУМАН.","LOS CHARCOS TE RALENTIZAN. LLEGA LA NIEBLA."],["SLIPPERY ICE: YOU SLIDE WHEN YOU MOVE","ГЛАДКИЙ ЛІД: ТИ ЄХАЄШ, КОЛИ РУХАЄШСЯ","HIELO RESBALADIZO: DESLIZAS AL MOVERTE"],["WIND GUST!","ПОРИВ ВІТРУ!","¡RÁFAGA DE VIENTO!"],["FOG ROLLS IN","НАСУВАЄТЬСЯ ТУМАН","LLEGA LA NIEBLA"],["BIG MAMA CLUCKSWORTH","ВЕЛИКА МАМА КВОКСВОРТ","GRAN MAMÁ CLUCSWORTH"],["Dodge her charge. Walls make her dizzy.","Ухиляйся від її натиску. Від стін у неї паморочиться голова.","Esquiva su embestida. Las paredes la marean."],["HARVEST SCARECROW","ЖНИВНЕ ЧУЧЕЛО","ESPANTAPÁJAROS DE LA COSECHA"],["Run from the pumpkin bombs. Stay out of the leaf storm.","Тікай від гарбузових бомб. Не стій у листяній бурі.","Huye de las bombas de calabaza. Aléjate de la tormenta de hojas."],["SERGEANT GOBBLER","СЕРЖАНТ ГУЛГОТУН","SARGENTO GLUGLÚ"],["His chest plate blocks shots. Hit him from behind.","Його нагрудна пластина блокує постріли. Бий ззаду.","Su peto bloquea los disparos. Golpéalo por detrás."],["BOG HEN BELLADONNA","БОЛОТНА КУРКА БЕЛАДОННА","GALLINA DEL PANTANO BELLADONA"],["Do not stand in the goo. Watch out for her leap.","Не стій у слизу. Стережися її стрибка.","No te quedes en el moco. Cuidado con su salto."],["PROFESSOR POULT","ПРОФЕСОР КУРЧУК","PROFESOR POLLUELO"],["Only the real one has a health bar. Clones pop in one hit.","Лише в справжнього є шкала здоров'я. Клони лопаються від одного удару.","Solo el verdadero tiene barra de salud. Los clones estallan de un golpe."],["DUCHESS FROSTBEAK","ГЕРЦОГИНЯ МОРОЗОДЗЬОБ","DUQUESA PICOHELADO"],["Dodge the ice spikes and the spinning frost beam.","Ухиляйся від крижаних шипів і крижаного променя, що обертається.","Esquiva los pinchos de hielo y el rayo de escarcha giratorio."],["WARLORD EMBER-COMB","ВОЛОДАР ЖАР-ГРЕБІНЬ","SEÑOR DE LA CRESTA ARDIENTE"],["Smash the fire totems to break his shield.","Розбий вогняні тотеми, щоб зламати його щит.","Destruye los tótems de fuego para romper su escudo."],["EMPEROR PLUME","ІМПЕРАТОР ПЛЮМ","EMPERADOR PLUMA"],["Fight the pull. Stay out of the beams.","Опирайся притяганню. Не потрапляй під промені.","Resiste la atracción. Evita los rayos."],["KING CLUCK THE LAST","КОРОЛЬ КЛЮК ОСТАННІЙ","REY CLUC EL ÚLTIMO"],["The final fight. Three phases - keep moving!","Фінальна битва. Три фази - не зупиняйся!","El combate final. Tres fases: ¡no pares de moverte!"],["ENRAGED!","РОЗЛЮЧЕНИЙ!","¡FURIOSO!"],["EXPOSED!","ВІДКРИТИЙ!","¡EXPUESTO!"],["BOSS DEFEATED!","БОСА ПОБІЖДЕНО!","¡JEFE DERROTADO!"],["THE KING HAS FALLEN!","КОРОЛЬ ПАВ!","¡EL REY HA CAÍDO!"],["VULNERABLE","ВРАЗЛИВИЙ","VULNERABLE"],["FINAL FORM","ОСТАТОЧНА ФОРМА","FORMA FINAL"],["ENRAGED","РОЗЛЮЧЕНИЙ","FURIOSO"],["DIZZY!","ЗАПАМОРОЧЕНИЙ!","¡MAREADO!"],["WINDED!","ЗАДИХАЄТЬСЯ!","¡SIN ALIENTO!"],["SHIELD UP!","ЩИТ УГОРУ!","¡ESCUDO ACTIVO!"],["FINAL FORM!","ОСТАТОЧНА ФОРМА!","¡FORMA FINAL!"],["SHIELDED","ПІД ЩИТОМ","CON ESCUDO"],["CRIT","КРИТ","CRÍTICO"],["DECOY","ДВІЙНИК","SEÑUELO"],["BLOCKED","БЛОК","BLOQUEO"],["DODGE","УХИЛ","ESQUIVA"],["SECOND WIND!","ДРУГИЙ ПОДИХ!","¡SEGUNDO ALIENTO!"],["REFLECT","ВІДБИТО","REFLEJO"],["ENDLESS MODE!","НЕСКІНЧЕННИЙ РЕЖИМ!","¡MODO INFINITO!"],["VICTORY!","ПЕРЕМОГА!","¡VICTORIA!"],["King Cluck the L om clearing waves, bosses and kills.","Монети дають за пройдені хвилі, босів і вбивства.","Las monedas se ganan al superar oleadas, jefes y bajas."],["PICKED","ОБРАНО","ELEGIDO"],["IN USE","ВИКОРИСТОВУЄТЬСЯ","EN USO"],["PICK","ОБРАТИ","ELEGIR"],["SELECTED","ОБРАНО","ELEGIDO"],["SELECT","ОБРАТИ","ELEGIR"],["DAILY CHALLENGE","ЩОДЕННЕ ВИПРОБУВАННЯ","DESAFÍO DIARIO"],["COMPLETED","ПРОЙДЕНО","COMPLETADO"],["PLAY AGAIN","ГРАТИ ЗНОВУ","JUGAR OTRA VEZ"],["PLAY DAILY","ГРАТИ ЩОДЕННЕ","JUGAR EL DIARIO"],["ACHIEVEMENTS","ДОСЯГНЕННЯ","LOGROS"],["PROGRESS RESET","ПРОГРЕС СКИНУТО","PROGRESO BORRADO"],["Coins, upgrades and hens cleared","Монети, покращення та курок очищено","Monedas, mejoras y gallinas borradas"],["LANGUAGE","МОВА","IDIOMA"],["LEFT-HANDED","ДЛЯ ЛІВШІ","PARA ZURDOS"],["Swap the move and aim sticks.","Поміняти місцями стіки руху і прицілу.","Intercambia los sticks de movimiento y apuntado."],["SOUND VOLUME","ГУЧНІСТЬ ЗВУКІВ","VOLUMEN DE SONIDO"],["Shots, hits and effects.","Постріли, влучання та ефекти.","Disparos, impactos y efectos."],["MUSIC VOLUME","ГУЧНІСТЬ МУЗИКИ","VOLUMEN DE MÚSICA"],["Background music and boss themes.","Фонова музика та теми босів.","Música de fondo y temas de jefes."],["AIM SENSITIVITY","ЧУТЛИВІСТЬ ПРИЦІЛУ","SENSIBILIDAD DE PUNTERÍA"],["How fast your hen turns to the aim stick.","Як швидко курка повертається за стіком прицілу.","Qué tan rápido gira tu gallina con el stick de apuntado."],["AIM ASSIST","АВТОПРИЦІЛ","AYUDA PARA APUNTAR"],["How strongly aim snaps to nearby enemies.","Наскільки сильно приціл липне до найближчих ворогів.","Cuánto se pega la mira a los enemigos cercanos."],["VIBRATION","ВІБРАЦІЯ","VIBRACIÓN"],["Short buzzes when you are hit or a boss strikes.","Короткі вібрації, коли тебе б'ють або вдаряє бос.","Vibraciones cortas cuando te golpean o ataca un jefe."],["MINIMAP","МІНІКАРТА","MINIMAPA"],["Show the arena map and arrows to pickups.","Показувати карту арени і стрілки до предметів.","Muestra el mapa de la arena y flechas hacia los objetos."],["TAP AGAIN TO CONFIRM","НАТИСНИ ЩЕ РАЗ ДЛЯ ПІДТВЕРДЖЕННЯ","TOCA OTRA VEZ PARA CONFIRMAR"],["RESET ALL PROGRESS","СКИНУТИ ВЕСЬ ПРОГРЕС","BORRAR TODO EL PROGRESO"],["MOD MENU","МОД-МЕНЮ","MENÚ DE MODS"],["ADMIN CODE","КОД АДМІНА","CÓDIGO DE ADMIN"],["ADMIN UNLOCKED","АДМІНА РОЗБЛОКОВАНО","ADMIN DESBLOQUEADO"],["Mod menu is open","Мод-меню відкрите","El menú de mods está abierto"],["WRONG CODE","НЕВІРНИЙ КОД","CÓDIGO INCORRECTO"],["Enter the secret admin code","Введи секретний код адміна","Introduce el código secreto de admin"],["MOD MENU LOCKED","МОД-МЕНЮ ЗАБЛОКОВАНО","MENÚ DE MODS BLOQUEADO"],["Cheats are off","Чити вимкнено","Trucos desactivados"],["KAMEHAMEHA BUTTON","КНОПКА КАМЕХАМЕХА","BOTÓN KAMEHAMEHA"],["On screen from the first second of every run (or press K). Charge a giant beam that wipes the whole map and wins the game. Mod menu only.","На екрані з першої секунди кожного забігу (або натисни K). Заряди гігантський промінь, який змітає всю карту і виграє гру. Лише в мод-меню.","En pantalla desde el primer segundo de cada partida (o pulsa K). Carga un rayo gigante que arrasa todo el mapa y gana el juego. Solo en el menú de mods."],["INFINITE COINS","НЕСКІНЧЕННІ МОНЕТИ","MONEDAS INFINITAS"],["Your balance never runs out. Switch off to get your real coins back.","Твій баланс ніколи не закінчується. Вимкни, щоб повернути справжні монети.","Tu saldo nunca se acaba. Desactívalo para recuperar tus monedas reales."],["GOD MODE","РЕЖИМ БОГА","MODO DIOS"],["Immortal: no damage from enemies, bullets, bosses or hazards.","Безсмертя: жодної шкоди від ворогів, куль, босів і перешкод.","Inmortal: sin daño de enemigos, balas, jefes ni peligros."],["ULTRA INSTINCT","УЛЬТРАІНСТИНКТ","ULTRAINSTINTO"],["Silver aura like Goku. Enemies can never hit you: you dodge every bullet and chicken on your own.","Срібна аура, як у Гоку. Вороги ніколи не влучать: ти сама ухиляєшся від кожної кулі й курки.","Aura plateada como la de Goku. Los enemigos nunca te alcanzan: esquivas cada bala y cada gallina por tu cuenta."],["INFINITE DAMAGE","НЕСКІНЧЕННА ШКОДА","DAÑO INFINITO"],["Every hit kills instantly, bosses included.","Кожен удар убиває миттєво, включно з босами.","Cada golpe mata al instante, jefes incluidos."],["INFINITE AMMO","НЕСКІНЧЕННІ ПАТРОНИ","MUNICIÓN INFINITA"],["All weapons unlocked with endless ammo.","Уся зброя відкрита з безмежними патронами.","Todas las armas desbloqueadas con munición sin límite."],["SPEEDHACK","СПІДХАК","SPEEDHACK"],["Movement speed multiplier.","Множник швидкості руху.","Multiplicador de velocidad de movimiento."],["START WAVE","СТАРТОВА ХВИЛЯ","OLEADA INICIAL"],["Every new run begins at this wave. A boss comes every 5 waves from wave 10; wave 50 is the final boss.","Кожен забіг починається з цієї хвилі. Бос з'являється кожні 5 хвиль, починаючи з 10-ї; хвиля 50 - фінальний бос.","Cada partida empieza en esta oleada. Hay un jefe cada 5 oleadas desde la 10; la oleada 50 es el jefe final."],["SLOW MOTION","УПОВІЛЬНЕНИЙ ЧАС","CÁMARA LENTA"],["Slows the whole fight down. 1.00x is normal speed.","Уповільнює весь бій. 1,00x - звичайна швидкість.","Ralentiza todo el combate. 1,00x es la velocidad normal."],["Start a run straight at this boss.","Почни забіг одразу з цим босом.","Empieza una partida directamente contra este jefe."],["ADD COINS","ДОДАТИ МОНЕТИ","AÑADIR MONEDAS"],["UNLOCK ALL HENS","РОЗБЛОКУВАТИ ВСІХ КУРОК","DESBLOQUEAR TODAS LAS GALLINAS"],["ALL HENS UNLOCKED","ВСІХ КУРОК РОЗБЛОКОВАНО","TODAS LAS GALLINAS DESBLOQUEADAS"],["MAX ALL UPGRADES","ПРОКАЧАТИ ВСЕ НА МАКС","MEJORAS AL MÁXIMO"],["SHOP UPGRADES MAXED","УСІ ПОКРАЩЕННЯ НА МАКСИМУМІ","TODAS LAS MEJORAS AL MÁXIMO"],["LOCK MOD MENU","ЗАБЛОКУВАТИ МОД-МЕНЮ","BLOQUEAR MENÚ DE MODS"],["Pick modes for your next run. Harder runs pay more coins when the run ends.","Обери режими для наступного забігу. Складніші забіги дають більше монет наприкінці.","Elige modos para tu próxima partida. Las partidas más difíciles dan más monedas al terminar."],["NO MODES SELECTED","РЕЖИМИ НЕ ОБРАНО","NINGÚN MODO ELEGIDO"],["The daily challenge ignores these modes.","Щоденне випробування ігнорує ці режими.","El desafío diario ignora estos modos."],["RUNS","ЗАБІГИ","PARTIDAS"],["BEST WAVE","НАЙКРАЩА ХВИЛЯ","MEJOR OLEADA"],["TOP RUNS","НАЙКРАЩІ ЗАБІГИ","MEJORES PARTIDAS"],["No runs yet. Play a run to set a record!","Забігів ще немає. Зіграй, щоб поставити рекорд!","Aún no hay partidas. ¡Juega una para marcar un récord!"],["VICTORY","ПЕРЕМОГА","VICTORIA"],["NO HAT","БЕЗ КАПЕЛЮХА","SIN SOMBRERO"],["PARTY HAT","СВЯТКОВИЙ КОЛПАК","GORRO DE FIESTA"],["COWBOY HAT","КОВБОЙСЬКИЙ КАПЕЛЮХ","SOMBRERO VAQUERO"],["TOP HAT","ЦИЛІНДР","SOMBRERO DE COPA"],["WIZARD HAT","КАПЕЛЮХ ЧАКЛУНА","SOMBRERO DE MAGO"],["ROYAL CROWN","КОРОЛІВСЬКА КОРОНА","CORONA REAL"],["GOLDEN HALO","ЗОЛОТИЙ НІМБ","AURA DORADA"],["CLASSIC","КЛАСИЧНИЙ","CLÁSICO"],["RUBY","РУБІНОВИЙ","RUBÍ"],["AZURE","ЛАЗУРОВИЙ","AZUL CIELO"],["MINT","М'ЯТНИЙ","MENTA"],["SHADOW","ТІНЬ","SOMBRA"],["GOLDEN","ЗОЛОТИЙ","DORADO"],["RAINBOW","ВЕСЕЛКОВИЙ","ARCOÍRIS"],["NO TRAIL","БЕЗ СЛІДУ","SIN ESTELA"],["STARDUST","ЗОРЯНИЙ ПИЛ","POLVO ESTELAR"],["BUBBLES","БУЛЬБАШКИ","BURBUJAS"],["CANDY","ЦУКЕРКИ","CARAMELOS"],["SLIME","СЛИЗ","BABA"],["FIRE TRAIL","ВОГНЯНИЙ СЛІД","ESTELA DE FUEGO"],["HATS","КАПЕЛЮХИ","SOMBREROS"],["COLOURS","КОЛЬОРИ","COLORES"],["TRAILS","СЛІДИ","ESTELAS"],["UNLOCKED","ВІДКРИТО","DESBLOQUEADO"],["EQUIPPED","НАДЯГНУТО","EQUIPADO"],["EQUIP","НАДЯГНУТИ","EQUIPAR"],["KAMEHAMEHA","КАМЕХАМЕХА","KAMEHAMEHA"],["KA","КА","KA"],["ME","МЕ","ME"],["HA","ХА","HA"],["HA!!!","ХА!!!","HA!!!"],["HAAAAA!!!","ХААААА!!!","HAAAAA!!!"],["NINJA","НІНДЗЯ","NINJA"],["Fast, silent and deadly.","Швидка, нечутна і смертельна.","Rápida, silenciosa y letal."],["75 health, 22% faster","75 здоров'я, на 22% швидша","75 de salud, un 22% más rápida"],["10% dodge chance, +12% crit chance","10% шанс ухилу, +12% шанс криту","10% de esquiva, +12% de probabilidad de crítico"],["Starts with Rapid Peck (80 rounds)","Починає зі Скороклювом (80 патронів)","Empieza con un Picotazo Rápido (80 balas)"],["MAGE","МАГ","MAGA"],["Fire, frost and sparks.","Вогонь, лід і іскри.","Fuego, hielo y chispas."],["85 health, 4% slower, 10% less damage","85 здоров'я, на 4% повільніша, на 10% менше шкоди","85 de salud, un 4% más lenta, un 10% menos de daño"],["Every bullet burns, slows and chain-zaps","Кожна куля палить, уповільнює і б'є ланцюговим розрядом","Cada bala quema, ralentiza y lanza descargas en cadena"],["ROBO-HEN","РОБО-КУРКА","ROBOGALLINA"],["A drone and a laser out of the box.","Дрон і лазер одразу з коробки.","Un dron y un láser de serie."],["120 health, 10% slower, 8% less damage taken","120 здоров'я, на 10% повільніша, на 8% менше отриманої шкоди","120 de salud, un 10% más lenta, un 8% menos de daño recibido"],["Starts with a drone chick and Laser Beak (90 charge)","Починає з курчам-дроном і Лазерним дзьобом (90 заряду)","Empieza con un pollito dron y Pico Láser (90 de carga)"],["BATTLE CRY","БОЙОВИЙ КЛІЧ","GRITO DE GUERRA"],["5 seconds of +60% fire rate and +25% speed.","5 секунд: +60% до скорострільності і +25% до швидкості.","5 segundos de +60% de cadencia y +25% de velocidad."],["SHIELD CHARGE","ЩИТОВИЙ РИВОК","EMBESTIDA CON ESCUDO"],["Dash through enemies to hurt them, then get a shield.","Прорвися крізь ворогів, завдаючи шкоди, і отримай щит.","Atraviesa a los enemigos hiriéndolos y consigue un escudo."],["BULLET TIME","ЧАС КУЛІ","TIEMPO BALA"],["Enemies and their bullets slow to 30%. Every shot crits.","Вороги та їхні кулі сповільнюються до 30%. Кожен постріл - крит.","Los enemigos y sus balas se ralentizan al 30%. Todos los disparos son críticos."],["BIG BANG","ВЕЛИКИЙ ВИБУХ","GRAN EXPLOSIÓN"],["A huge blast that erases bullets and hurts everything near you.","Величезний вибух стирає кулі та шкодить усьому поруч.","Una explosión enorme borra las balas y daña todo lo cercano."],["SHADOW STEP","КРОК ТІНІ","PASO SOMBRA"],["Blink forward through enemies. Your next 3 shots crit.","Блимни вперед крізь ворогів. Наступні 3 постріли - криті.","Salta hacia delante a través de los enemigos. Tus próximos 3 disparos son críticos."],["METEOR SHOWER","МЕТЕОРНИЙ ДОЩ","LLUVIA DE METEOROS"],["Fireballs rain down on the nearest enemies.","Вогняні кулі падають на найближчих ворогів.","Bolas de fuego caen sobre los enemigos más cercanos."],["SENTRY TURRET","ТУРЕЛЬ-СТОРОЖ","TORRETA CENTINELA"],["Drop a turret that shoots nearby enemies for 10 seconds.","Постав турель, що 10 секунд стріляє по ворогах поруч.","Coloca una torreta que dispara a los enemigos cercanos durante 10 segundos."],["BATTLE CRY!","БОЙОВИЙ КЛІЧ!","¡GRITO DE GUERRA!"],["SHIELD CHARGE!","ЩИТОВИЙ РИВОК!","¡EMBESTIDA CON ESCUDO!"],["BULLET TIME!","ЧАС КУЛІ!","¡TIEMPO BALA!"],["BIG BANG!","ВЕЛИКИЙ ВИБУХ!","¡GRAN EXPLOSIÓN!"],["SHADOW STEP!","КРОК ТІНІ!","¡PASO SOMBRA!"],["METEOR SHOWER!","МЕТЕОРНИЙ ДОЩ!","¡LLUVIA DE METEOROS!"],["SENTRY ONLINE!","ТУРЕЛЬ ГОТОВА!","¡TORRETA ACTIVA!"],["GAMEPAD","ГЕЙМПАД","MANDO"],["GAMEPAD CONNECTED","ГЕЙМПАД ПІДКЛЮЧЕНО","MANDO CONECTADO"],["GAMEPAD DISCONNECTED","ГЕЙМПАД ВІДКЛЮЧЕНО","MANDO DESCONECTADO"],["Left stick moves, right stick aims, RT fires, A or Y uses the hen ability, X or LB swaps weapons, Start pauses.","Лівий стік - рух, правий - приціл, RT - вогонь, A або Y - здібність курки, X або LB - зміна зброї, Start - пауза.","Stick izquierdo mueve, derecho apunta, RT dispara, A o Y usa la habilidad de la gallina, X o LB cambia de arma, Start pausa."],["COLOR-BLIND MODE","РЕЖИМ ДЛЯ ДАЛЬТОНІКІВ","MODO PARA DALTÓNICOS"],["High-contrast danger markers: orange with white outlines. Friendly effects turn blue.","Контрастні маркери небезпеки: помаранчеві з білим обведенням. Дружні ефекти стають синіми.","Marcadores de peligro de alto contraste: naranjas con borde blanco. Los efectos amigos se vuelven azules."],["SAVE CODE","КОД ЗБЕРЕЖЕННЯ","CÓDIGO DE GUARDADO"],["COPY CODE","КОПІЮВАТИ КОД","COPIAR CÓDIGO"],["PASTE","ВСТАВИТИ","PEGAR"],["IMPORT CODE","ІМПОРТУВАТИ КОД","IMPORTAR CÓDIGO"],["TAP AGAIN TO REPLACE","НАТИСНИ ЩЕ РАЗ ДЛЯ ЗАМІНИ","TOCA OTRA VEZ PARA REEMPLAZAR"],["TAP AGAIN TO REPLACE PROGRESS","НАТИСНИ ЩЕ РАЗ, ЩОБ ЗАМІНИТИ ПРОГРЕС","TOCA OTRA VEZ PARA REEMPLAZAR EL PROGRESO"],["Move your progress to another phone without a cloud. Tap COPY CODE and send the code to yourself. On the other phone open this screen, paste the code into the box and tap IMPORT CODE.","Перенеси прогрес на інший телефон без хмари. Натисни КОПІЮВАТИ КОД і надішли код собі. На іншому телефоні відкрий цей екран, встав код у поле й натисни ІМПОРТУВАТИ КОД.","Pasa tu progreso a otro móvil sin nube. Toca COPIAR CÓDIGO y envíate el código. En el otro móvil abre esta pantalla, pega el código en el cuadro y toca IMPORTAR CÓDIGO."],["Copy the code, or paste one and import it.","Скопіюй код або встав чужий та імпортуй.","Copia el código, o pega uno e impórtalo."],["CODE READY - TAP COPY CODE","КОД ГОТОВИЙ - НАТИСНИ КОПІЮВАТИ КОД","CÓDIGO LISTO - TOCA COPIAR CÓDIGO"],["COULD NOT MAKE A CODE","НЕ ВДАЛОСЯ СТВОРИТИ КОД","NO SE PUDO CREAR EL CÓDIGO"],["COPIED!","СКОПІЙОВАНО!","¡COPIADO!"],["LONG-PRESS THE BOX TO COPY","УТРИМУЙ ПОЛЕ, ЩОБ СКОПІЮВАТИ","MANTÉN PULSADO EL CUADRO PARA COPIAR"],["LONG-PRESS THE BOX AND CHOOSE PASTE","УТРИМУЙ ПОЛЕ ТА ОБЕРИ ВСТАВИТИ","MANTÉN PULSADO EL CUADRO Y ELIGE PEGAR"],["PASTED - NOW TAP IMPORT","ВСТАВЛЕНО - ТЕПЕР НАТИСНИ ІМПОРТ","PEGADO - AHORA TOCA IMPORTAR"],["THE CLIPBOARD IS EMPTY","БУФЕР ОБМІНУ ПОРОЖНІЙ","EL PORTAPAPELES ESTÁ VACÍO"],["PASTE A CODE FIRST","СПОЧАТКУ ВСТАВ КОД","PEGA PRIMERO UN CÓDIGO"],["CODE OK - TAP AGAIN TO REPLACE PROGRESS","КОД ПІДХОДИТЬ - НАТИСНИ ЩЕ РАЗ, ЩОБ ЗАМІНИТИ ПРОГРЕС","CÓDIGO CORRECTO - TOCA OTRA VEZ PARA REEMPLAZAR EL PROGRESO"],["THE CODE IS DAMAGED OR EDITED","КОД ПОШКОДЖЕНИЙ АБО ЗМІНЕНИЙ","EL CÓDIGO ESTÁ DAÑADO O EDITADO"],["NOT A VALID SAVE CODE","ЦЕ НЕ КОД ЗБЕРЕЖЕННЯ","NO ES UN CÓDIGO DE GUARDADO VÁLIDO"],["SAVE IMPORTED","ЗБЕРЕЖЕННЯ ІМПОРТОВАНО","PARTIDA IMPORTADA"],["Progress replaced","Прогрес замінено","Progreso reemplazado"],["BEST","КРАЩЕ","MEJOR"],["BOSS RUSH","БОС-РАШ","BOSS RUSH"],["RUSH","РАШ","RUSH"],["RUSH CLEARED!","РАШ ПРОЙДЕНО!","¡RUSH SUPERADO!"],["RUSH OVER","РАШ ЗАВЕРШЕНО","RUSH TERMINADO"],["BOSS RUSH CLEARED!","БОС-РАШ ПРОЙДЕНО!","¡BOSS RUSH SUPERADO!"],["BOSS DOWN!","БОС ПАВ!","¡JEFE ABATIDO!"],["START RUSH","ПОЧАТИ РАШ","EMPEZAR RUSH"],["RUSH AGAIN","РАШ ЗНОВУ","OTRO RUSH"],["TOP RUSHES","НАЙКРАЩІ РАШІ","MEJORES RUSHES"],["BEST CLEAR","КРАЩЕ ПРОХОДЖЕННЯ","MEJOR SUPERACIÓN"],["RUSHES","РАШІ","RUSHES"],["NEW RECORD!","НОВИЙ РЕКОРД!","¡NUEVO RÉCORD!"],["NEW BEST TIME!","НОВИЙ РЕКОРД ЧАСУ!","¡NUEVO MEJOR TIEMPO!"],["BOSSES BEATEN","БОСІВ ПОБІЖДЕНО","JEFES DERROTADOS"],["FELL HERE","ПАЛА ТУТ","CAYÓ AQUÍ"],["CLEARED","ПРОЙДЕНО","SUPERADO"],["Fight every boss in a row. Between fights you heal a bit and pick one reward. Your record is the most bosses beaten, then the fastest total fight time.","Борися з усіма босами підряд. Між боями трохи лікуєшся й береш одну нагороду. Рекорд - найбільше переможених босів, а потім найшвидший загальний час.","Lucha contra todos los jefes seguidos. Entre combates te curas un poco y eliges una recompensa. Tu récord es el mayor número de jefes derrotados y, después, el menor tiempo total."],["No rushes yet. Beat a boss to set a record!","Рашів ще немає. Переможи боса, щоб поставити рекорд!","Aún no hay rushes. ¡Derrota a un jefe para marcar un récord!"],["BOSS RUSHER","РАШЕР БОСІВ","CORREDORA DE JEFES"],["Clear Boss Rush: beat every boss in a row.","Пройди Бос-раш: переможи всіх босів підряд.","Supera el Boss Rush: derrota a todos los jefes seguidos."],["ASHEN VOLCANO","ПОПЕЛЯСТИЙ ВУЛКАН","VOLCÁN DE CENIZA"],["DEEP SPACE","ГЛИБОКИЙ КОСМОС","ESPACIO PROFUNDO"],["LAVA BURNS! DODGE THE ERUPTIONS","ЛАВА ПАЛИТЬ! УХИЛЯЙСЯ ВІД ВИВЕРЖЕНЬ","¡LA LAVA QUEMA! ESQUIVA LAS ERUPCIONES"],["LOW GRAVITY: YOU DRIFT. METEORS FALL","МАЛА ГРАВІТАЦІЯ: ТИ ПЛАВАЄШ. ПАДАЮТЬ МЕТЕОРИ","POCA GRAVEDAD: FLOTAS. CAEN METEOROS"], function rollPerks(n, big) {
  const pool = PERKS.filter(pk => (taken[pk.id] || 0) < pk.max && (!pk.ok || pk.ok()) && !(hm('pistol') && ['rocket', 'laser', 'flame', 'xbow', 'nade'].includes(pk.id)));
  const out = [];
  const wt = pk => big ? (pk.rar === 'e' ? 60 : pk.rar === 'r' ? 40 : 6) : (pk.rar === 'e' ? 6 + wave * 1.5 : pk.rar === 'r' ? 30 : 60);
  while (out.length < n && pool.length) {
    let sum = 0; for (const pk of pool) sum += wt(pk);
    let r = Math.random() * sum, idx = 0;
    for (; idx < pool.length - 1; idx++) { r -= wt(pool[idx]); if (r <= 0) break; }
    out.push(pool[idx]); pool.splice(idx, 1);
  }
  return out;
}
function takePerk(pk) { taken[pk.id] = (taken[pk.id] || 0) + 1; pk.fn(player.mods); }

function updatePickups(dt) {

function obstacleSprite(o) {

    const r = o.r;

    gr.addColorStop(0, '#f6d77a'); gr.addColorStop(.7, '#e0b84a'); gr.addColorStop(1, '#b88a2c');

      g.beginPath(); g.arc(rnd(-1.5, 1.5), rnd(-1.5, 1.5), r * k / 5.6, o.rot, o.rot + rnd(4.2, 5.6)); g.stroke();
    }

      const a = rnd(0, TAU), d = rnd(.1, .98) * r, l = rnd(4, 9), da = a + rnd(-.5, .5);
      g.strokeStyle = Math.random() < .5 ? 'rgba(120,80,15,.45)' : 'rgba(255,240,170,.5)'; g.lineWidth = 1.2;
      g.beginPath(); g.moveTo(Math.cos(a) * d, Math.sin(a) * d); g.lineTo(Math.cos(a) * d + Math.cos(da) * l, Math.sin(a) * d + Math.sin(da) * l); g.stroke();
    }
    g.strokeStyle = 'rgba(95,60,20,.65)'; g.lineWidth = 3;
    for (const f of [.42, .78]) { g.beginPath(); g.arc(0, 0, r * f, 0, TAU); g.stroke(); }
    g.strokeStyle = '#8f6a1f'; g.lineWidth = 3; g.beginPath(); g.arc(0, 0, r - 1, 0, TAU); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.18)'; g.beginPath(); g.ellipse(-r * .3, -r * .35, r * .35, r * .2, -.6, 0, TAU); g.fill();

      const y0 = -s / 2 + i * s / 4;

      g.strokeStyle = 'rgba(70,40,15,.35)'; g.lineWidth = 1;
      for (let k = 0; k < 4; k++) {
        const gy = y0 + rnd(2, s / 4 - 3);
        g.beginPath(); g.moveTo(-s / 2 + rnd(0, 8), gy); g.lineTo(s / 2 - rnd(0, 8), gy + rnd(-1.5, 1.5)); g.stroke();
      }
      g.fillStyle = 'rgba(40,22,8,.55)'; g.fillRect(-s / 2, y0 + s / 4 - 1.5, s, 1.5);
    }
    g.strokeStyle = '#6a4423'; g.lineWidth = s * .1; g.strokeRect(-s / 2 + s * .05, -s / 2 + s * .05, s * .9, s * .9);
    g.lineWidth = s * .08; g.beginPath(); g.moveTo(-s * .42, -s * .42); g.lineTo(s * .42, s * .42); g.stroke();
    g.fillStyle = '#3a3a40';
    for (const q of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { g.beginPath(); g.arc(q[0] * s * .4, q[1] * s * .4, 2.2, 0, TAU); g.fill(); }

}

const VG = { c: null, key: '' };       // the vignette is a soft gradient: it is painted once on a tiny canvas and stretched, not re-evaluated per pixel every frame
function drawVignette() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const key = W + 'x' + H + ':' + biome;
  if (VG.key !== key) {
    try {
      if (!VG.c) VG.c = document.createElement('canvas');
      const vw = 128, vh = Math.max(32, Math.round(128 * H / W)); VG.c.width = vw; VG.c.height = vh;

const CRATE_COL = { shotgun: '#e07a1f', smg: '#2a7de1', rocket: '#b8362b', laser: '#14a8a8', flame: '#e8651a', xbow: '#7a5230', nade: '#4f6b2a' };

}

      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(tx, ty); ctx.stroke();

      ctx.fillStyle = '#fffaf0'; ctx.beginPath(); ctx.ellipse(b.x, b.y, 9, 7, Math.atan2(b.vy, b.vx), 0, TAU); ctx.fill();
      ctx.strokeStyle = '#8f7a55'; ctx.lineWidth = 2; ctx.stroke();

function drawWorld() {
  const sx = shake ? rnd(-shake, shake) : 0, sy = shake ? rnd(-shake, shake) : 0;
  const k = DPR * S;
  ctx.setTransform(k, 0, 0, k, (W / 2 - cam.x * S + sx) * DPR, (H / 2 - cam.y * S + sy) * DPR);
  ctx.drawImage(bg, 0, 0);
  drawPuddles(); drawLava();
  for (const o of obstacles) drawObstacle(o);
  for (const p of pickups) drawPickup(p);
  drawHazards(); drawDuelZone();

  const list = enemies.filter(e => !e.dead).sort((a, b) => a.y - b.y);
  for (const e of list) { shadow(e.x, e.y, e.r * 1.1, e.r * .8); if (cbOn()) cbRing(e.x, e.y, e.r, CBD); }
  if (state === 'play' || state === 'perk') coEach(() => { if (CO && CO.hs[CO.cur].gone) return; shadow(player.x, player.y, player.r * 1.1, player.r * .8); if (cbOn()) cbRing(player.x, player.y, player.r, CBF); });
  for (const e of list) {
    const d = ETYPES[e.type];
    if (e.slowT > 0) { ctx.strokeStyle = 'rgba(127,243,255,.8)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 5, 0, TAU); ctx.stroke(); }
    if (e.boss || e.decoy || e.totem) { drawSpecial(e); continue; }
    drawChicken(e.x, e.y, e.r, e.ang, d.pal, e.flash, e.walk, d.gun, 0, { band: d.band, helmet: d.helmet, bandana: d.bandana, medic: d.medic, dyn: d.dyn, angry: true });
    if (e.fuse > 0) { ctx.strokeStyle = 'rgba(255,93,58,.9)'; ctx.lineWidth = 2.5; ctx.setLineDash([6, 5]); ctx.beginPath(); ctx.arc(e.x, e.y, 105 * (1 - Math.max(0, e.fuse) / .65 * .5), 0, TAU); ctx.stroke(); ctx.setLineDash([]); }
    if (e.hp < e.maxhp) {
      const w = e.r * 1.8;
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(e.x - w / 2, e.y - e.r - 14, w, 5);
      ctx.fillStyle = '#ff5d5d'; ctx.fillRect(e.x - w / 2, e.y - e.r - 14, w * Math.max(0, e.hp / e.maxhp), 5);
    }
  }
  drawTrail();
  if (state === 'play' || state === 'perk') coEach(drawHen);
  coEach(drawDrones);
  coEach(drawAbilityWorld);
  for (const b of bullets) drawBullet(b);
  drawKame();
  for (const q of parts) {
    if (q.k === 2) {
      const pr = 1 - q.life / q.max;
      ctx.globalAlpha = Math.max(0, 1 - pr);
      ctx.fillStyle = q.fc || 'rgba(255,200,80,.25)';
      ctx.beginPath(); ctx.arc(q.x, q.y, q.sz * (.25 + .75 * pr), 0, TAU); ctx.fill();
      ctx.strokeStyle = q.c; ctx.lineWidth = 2 + 8 * (1 - pr); ctx.stroke();
      continue;
    }
    if (q.k === 3) {
      ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
      ctx.strokeStyle = '#9fe8ff'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(q.x, q.y);
      for (let s = 1; s < 4; s++) {
        const f = s / 4;
        ctx.lineTo(lerp(q.x, q.x2, f) + rnd(-10, 10), lerp(q.y, q.y2, f) + rnd(-10, 10));
      }
      ctx.lineTo(q.x2, q.y2); ctx.stroke();
      continue;
    }
    ctx.globalAlpha = clamp(q.life / .35, 0, 1);
    ctx.fillStyle = q.c;
    if (q.k === 0) {
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot);
      ctx.beginPath(); ctx.ellipse(0, 0, q.sz, q.sz * .38, 0, 0, TAU); ctx.fill(); ctx.restore();
    } else { ctx.fillRect(q.x - q.sz / 2, q.y - q.sz / 2, q.sz, q.sz); }
  }
  ctx.globalAlpha = 1;
  for (const f of floaters) {
    ctx.globalAlpha = clamp(f.life / .4, 0, 1);
    text(f.str, f.x, f.y, 17, f.c, 'center');
  }
  ctx.globalAlpha = 1;
}

/* one hen with its shield, orbs and (in co-op) a marker; the current context decides which hen it is */

  for (const s of ui.sliders) if (x >= s.x - 12 && x <= s.x + s.w + 12 && y >= s.y && y <= s.y + s.h) { ui.down.slider = s; s.set(clamp((x - s.x) / s.w, 0, 1)); break; }

  if (d.moved || cancel) return;

    const h = ui.hits[i];

}

    boxInfo() { const b = saveBox; return b ? { disp: b.style.display, l: b.style.left, t: b.style.top, w: b.style.width, h: b.style.height, len: b.value.length } : null; },
    importCodeStr(c) { return parseSaveCode(c).then(o => { const r = sanitizeSave(o); applySaveData(r); return r; }); },
    saveSnap() { return JSON.parse(JSON.stringify(SAVE)); },
    setSave(k, v) { SAVE[k] = v; },
    rushInfo() { return { RR: RR ? { i: RR.i, t: +RR.t.toFixed(2), splits: RR.splits.slice(), done: RR.done } : null, res: rushRes, save: JSON.parse(JSON.stringify(SAVE.rush)), wave, boss: boss ? boss.kind : null, countT: +countT.toFixed(2), state }; },
    puddleAt() { return puddles[0] ? { x: puddles[0].x, y: puddles[0].y } : null; },
    setPos(x, y) { player.x = x; player.y = y; },
    ending() { openEnding(); },
    modesNow() { return Object.assign({}, runModes); },
    cheated() { return runCheat; },
    ab() { return { id: AB.id, cd: +AB.cd.toFixed(2), t: +AB.t.toFixed(2), foeK, meteors: meteors.length, turrets: turrets.length, critShots: player.critShots, rate: player.abRate }; },
    useAb() { return useAbility(); },
    abCd(v) { AB.cd = v; },
    setChar(id) { SAVE.chars[id] = true; SAVE.sel = id; },
    login() { return { info: loginInfo(), L: JSON.parse(JSON.stringify(SAVE.login)), day: dayNum(), gift: giftShown }; },
    setLogin(o) { Object.assign(SAVE.login, o); },
    claim() { return claimLogin(); },
    runBoost() { return JSON.parse(JSON.stringify(runBoost)); },
    ach(id) { ach(id); },
    i18nAll() { return { dict: I18N, pats: I18N_PAT.map(q => [q[0].source, q[1].toString()]) }; },
    gainXP(n) { gainXP(n); },
    runSave() { return runSaved ? JSON.parse(JSON.stringify(runSaved)) : null; },
    runRaw() { try { return localStorage.getItem(RUN_KEY); } catch (e) { return null; } },
    reloadRun() { runSaved = loadRunSave(); return !!runSaved; },
    saveRunNow() { saveRunNow(); runSaved = loadRunSave(); return !!runSaved; },
    resume() { return resumeRun(); },
    modsKeys() { return Object.keys(player.mods); },
    newModsKeys() { return Object.keys(newMods()); },
    perkState() { return { taken: JSON.parse(JSON.stringify(taken)), mods: JSON.parse(JSON.stringify(player.mods)), ammo: Object.fromEntries(Object.entries(player.ammo).map(e => [e[0], e[1] === Infinity ? 'inf' : e[1]])), unlocked: player.unlocked, weapon: player.weapon, hp: player.hp, maxhp: player.maxhp, level, xp, score, kills, wave, runCoins, state }; },
    killAll() { enemies.filter(e => !e.dead && !e.boss).forEach(killEnemy); },
    addRun(n) { addRunCoins(n, 'kills'); },
    quit() { quitRun(); },
    runInfo() { return { runCoins, runBreak: JSON.parse(JSON.stringify(runBreak)), wave, kills, maxhp: player.maxhp, hp: player.hp, xpMul: player.mods.xp, revive: player.mods.revive, runBoost: JSON.parse(JSON.stringify(runBoost)), cchain }; },
    lang(l) { SAVE.set.lang = l; setLang(l); },
    miss() { return [...MISS]; },
    tr(s) { return tr(s, true); },
    clearMiss() { MISS.clear(); trCache.clear(); }
  }
};
})();
</script>
