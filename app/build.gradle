plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cluckload.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cluckload.game'
        minSdk 26
        targetSdk 35
        versionCode 33
        versionName '4.7'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
